; Pi-hole's Lists Updater by Jack'lul
; https://github.com/jacklul/pihole-updatelists
; For a full list of available variables please see the readme.
;
; Updated: 2026-11-01
; Sources:
;   - Firebog ticked lists (Safe baseline)
;   - Steve Jenkins curated LoL (HaGeZi Pro++, TIF, OISD Big, RPiList, etc.)
;   - Custom Blocklists (/etc/pihole/custom-blocklists.list) featuring:
;       * HaGeZi DynDNS & Anti-Piracy
;       * HaGeZi Native OS/Device Trackers (Apple, Amazon, Windows, Samsung, LG, TikTok)
;       * Smart TV & Android telemetry (Perflyst, mboutolleau)
;       * Developer Dan (Ads & Tracking Extended, AMP)
;       * 1Hosts Lite
;       * Dandelion Sprout Game Console AdBlock
;   - Whitelists: anudeepND + HaGeZi Referral Allowlist (prevents breaking shopping/search)
;   - Regex: mmotti + Steve Jenkins

; Remote list URL containing list of blocklists to import
; URLs to single lists are not supported here!
BLOCKLISTS_URL="https://v.firebog.net/hosts/lists.php?type=tick
https://raw.githubusercontent.com/stevejenkins/pi-hole-lists/main/blocklists.txt
/etc/pihole/custom-blocklists.list"

; Remote list URL containing list of allowlists to import
; URLs to single lists are not supported here!
ALLOWLISTS_URL="https://raw.githubusercontent.com/stevejenkins/pi-hole-lists/main/whitelists.txt"

; Remote list URL containing exact domains to whitelist
; This is specifically for handcrafted lists only, do not use regular allowlists here!
WHITELIST_URL="https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/whitelist-referral.txt"

; Remote list URL containing regex rules for whitelisting
REGEX_WHITELIST_URL="https://raw.githubusercontent.com/mmotti/pihole-regex/master/whitelist.list"

; Remote list URL containing exact domains to blacklist
; This is specifically for handcrafted lists only, do not use regular blocklists here!
BLACKLIST_URL=""

; Remote list URL containing regex rules for blacklisting
REGEX_BLACKLIST_URL="https://raw.githubusercontent.com/mmotti/pihole-regex/master/regex.list
https://raw.githubusercontent.com/stevejenkins/pi-hole-lists/main/regex.txt"
